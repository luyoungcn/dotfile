# Starship prompt for this dotfiles repository.
#
# Design goals:
# - One Dark colours shared with Xresources and the terminal palette.
# - A quiet, two-line prompt: context and repository state above, input below.
# - Useful information at a glance without making every shell prompt noisy.
# - Nerd Font symbols are used consistently with tmux and Powerlevel10k.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
scan_timeout = 50
palette = 'one_dark'

# First line: location and repository state on the left, transient context on
# the right. The second line is deliberately reserved for the command itself.
format = """
$username$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$jobs\
$python\
$nodejs\
$rust\
$golang\
$time
$line_break$character"""

[palettes.one_dark]
black = '#1E2127'
bright_black = '#5C6370'
red = '#E06C75'
green = '#98C379'
yellow = '#D19A66'
blue = '#61AFEF'
purple = '#C678DD'
cyan = '#56B6C2'
white = '#ABB2BF'
bright_white = '#FFFFFF'

[username]
show_always = false
style_user = 'fg:cyan'
style_root = 'bold fg:red'
format = '[$user]($style)'

[hostname]
ssh_only = true
ssh_symbol = '  '
style = 'fg:cyan'
format = '[$ssh_symbol$hostname]($style) '

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' '
read_only_style = 'fg:red'
style = 'bold fg:blue'
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ' '
style = 'fg:purple'
format = '[$symbol$branch]($style) '
truncation_length = 24
truncation_symbol = '…'

[git_status]
style = 'fg:red'
format = '([$all_status$ahead_behind]($style) )'
conflicted = ' '
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '󰏗 '
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[fill]
symbol = '·'
style = 'fg:bright_black'

[status]
disabled = false
map_symbol = true
pipestatus = true
symbol = '✘ '
style = 'fg:red'
format = '[$symbol$status]($style) '

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = 'fg:yellow'
format = '[󰔛 $duration]($style) '

[jobs]
number_threshold = 1
symbol = '✦ '
style = 'fg:cyan'
format = '[$symbol$number]($style) '

[python]
symbol = ' '
style = 'fg:yellow'
format = '[$symbol$virtualenv]($style) '

[nodejs]
symbol = ' '
style = 'fg:green'
format = '[$symbol$version]($style) '

[rust]
symbol = ' '
style = 'fg:red'
format = '[$symbol$version]($style) '

[golang]
symbol = ' '
style = 'fg:cyan'
format = '[$symbol$version]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:bright_black'
format = '[ $time]($style)'

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:purple)'
vimcmd_replace_one_symbol = '[❮](bold fg:purple)'
vimcmd_replace_symbol = '[❮](bold fg:purple)'
vimcmd_visual_symbol = '[V](bold fg:purple)'
